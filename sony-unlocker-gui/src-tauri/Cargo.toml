[package]
name = "sony-unlocker"
version = "0.1.0"
edition = "2021"
description = "Sony Xperia Bootloader Unlock GUI - based on xperable"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync"] }
log = "0.4"
env_logger = "0.11"

[lib]
name = "sony_unlocker_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "sony-unlocker"
path = "src/main.rs"
